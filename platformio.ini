;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:stc15f2k60s2]
platform = intel_mcs51
board = stc15f2k60s2
upload_speed = 57600
; This project uses SDCC's legacy __at/__interrupt syntax (e.g. __at ADDR+OFFSET,
; __interrupt N __using M). SDCC 4.4.0 (the default toolchain-sdcc) rejects that
; syntax and requires the parenthesized form instead. Pin 4.1.0, which builds
; the existing sources unmodified.
platform_packages =
    toolchain-sdcc@1.40100.12072

; auto-detected: /dev/cu.usbserial-0001
