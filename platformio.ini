;PlatformIO Project Configuration File
;
; Monorepo 2 san pham dung chung phan cung + toolchain:
;   env:door  - bo dieu khien cua cuon (A7-1.7)
;   env:relay - hop 4 relay doc lap (RELAY4 v1.1)
;
; Ma DUNG CHUNG (bien dich cho ca 2 env) nam o thu muc goc:
;   src/{common.h,eeprom.*,gsm.*,help.h,lcd.*,true.h}, include/stc15.h,
;   include/gsm_serial.c, include/rf_decode.inc (bo giai ma RF dung chung).
; Ma RIENG tung san pham: src/<product>/main.c + include/<product>/{main.h,
;   motor_cam_phim.c, xu_ly_tin_nhan.c}. Moi env chon dung main.c cua no
;   (build_src_filter) va tro -I vao include/<product> de "#include "main.h""...
;   resolve dung ban.

[platformio]
default_envs = door

[env]
platform = intel_mcs51
board = stc15f2k60s2
upload_speed = 57600
; SDCC legacy __at/__interrupt syntax -> pin 4.1.0 (4.4.0 reject cu phap cu).
platform_packages =
    toolchain-sdcc@1.40100.12072

[env:door]
build_src_filter = +<*> -<relay/>
build_flags = -Iinclude/door

[env:relay]
build_src_filter = +<*> -<door/>
build_flags = -Iinclude/relay
