;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Monorepo, 2 san pham dung chung phan cung + toolchain:
;   env:door  - bo dieu khien cua cuon (goc)
;   env:relay - hop 4 relay doc lap (relay switch box)
; Ma dung chung (src/common.h, eeprom.*, gsm.*, help.h, lcd.*, true.h,
; include/stc15.h, include/gsm_serial.c) nam o thu muc goc, bien dich cho
; CA HAI moi truong. Ma rieng tung san pham (main.c/main.h/motor_cam_phim.c/
; xu_ly_tin_nhan.c) nam duoi src/<product>/ + include/<product>/; moi env
; chon dung main.c can bien dich (build_src_filter) va tro dung thu muc
; include rieng (build_flags -I) de "#include "main.h"" ... resolve dung ban.
[platformio]
default_envs = door

[env]
platform = intel_mcs51
board = stc15f2k60s2
upload_speed = 57600
; This project uses SDCC's legacy __at/__interrupt syntax (e.g. __at ADDR+OFFSET,
; __interrupt N __using M). SDCC 4.4.0 (the default toolchain-sdcc) rejects that
; syntax and requires the parenthesized form instead. Pin 4.1.0, which builds
; the existing sources unmodified.
platform_packages =
    toolchain-sdcc@1.40100.12072

; auto-detected: /dev/cu.usbserial-0001

[env:door]
; Bo dieu khien cua cuon (rolling door controller), ver "CUACUON A7-1.6".
build_src_filter = +<*> -<relay/>
build_flags = -Iinclude/door

[env:relay]
; Hop 4 relay doc lap (relay switch box), ver "RELAY4 v1.0".
build_src_filter = +<*> -<door/>
build_flags = -Iinclude/relay
